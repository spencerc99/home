name: Sync creations and writing from Coda

# Pulls creations + newsletter posts from Coda and commits any changes to main,
# which triggers the normal Cloudflare deploy. Runs on a schedule, on demand
# from the Actions tab, or instantly via a repository_dispatch from Coda.
# A manual run on any other branch is a dry run: it imports and builds but
# does not commit or push.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [coda-sync]

concurrency:
  group: coda-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: bun install --frozen-lockfile

      - name: Import from Coda
        run: bun run import-all

      - name: Validate content
        run: bun run build

      - name: Commit and push changes
        if: github.ref == 'refs/heads/main'
        run: |
          git add -A src/content public/creation-videos
          if git diff --cached --quiet; then
            echo "No changes from Coda"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync creations and writing from Coda"
          git push origin HEAD:main
